<title>打字练习台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    /* workspace: modes bar, stat strip, paper plate, keycap deck */
    --bg:#e9edef;
    --surface:#f7f9fa;
    --surface-2:#dfe5e8;
    --ink:#16222a;
    --muted:#5d6d78;
    --line:#ccd5da;
    --line-strong:#aebbc3;
    --accent:#0e6f6a;
    --accent-soft:#d6ece9;
    --accent-ink:#f3fbfa;
    --good:#1d7a4c;
    --bad:#b23a2f;
    --bad-soft:#f0d2cd;
    --key-bg:#fcfdfd;
    --key-edge:#a3b3bc;
    --key-text:#1f2c35;
    --radius:14px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1519;
      --surface:#161f24;
      --surface-2:#1d282e;
      --ink:#e5edf1;
      --muted:#8da0ab;
      --line:#26343c;
      --line-strong:#3b4e59;
      --accent:#4cc4b9;
      --accent-soft:#15332f;
      --accent-ink:#08221f;
      --good:#5fce96;
      --bad:#ff8577;
      --bad-soft:#3a1d19;
      --key-bg:#1c272e;
      --key-edge:#080d10;
      --key-text:#dbe6ec;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1519;
    --surface:#161f24;
    --surface-2:#1d282e;
    --ink:#e5edf1;
    --muted:#8da0ab;
    --line:#26343c;
    --line-strong:#3b4e59;
    --accent:#4cc4b9;
    --accent-soft:#15332f;
    --accent-ink:#08221f;
    --good:#5fce96;
    --bad:#ff8577;
    --bad-soft:#3a1d19;
    --key-bg:#1c272e;
    --key-edge:#080d10;
    --key-text:#dbe6ec;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{
    max-width:1060px;
    margin:0 auto;
    padding-block:18px 26px;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:100%;
  }

  /* header */
  .top{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px 24px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brandmark{
    width:40px;height:40px;flex:none;
    display:grid;place-items:center;
    border:1px solid var(--line-strong);
    border-bottom:3px solid var(--key-edge);
    border-radius:8px;
    background:var(--key-bg);
    color:var(--ink);
    font:600 18px/1 var(--mono);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
  }
  .brand h1{
    margin:0;
    font:600 17px/1.25 var(--sans);
    letter-spacing:.02em;
    text-wrap:balance;
  }
  .tagline{
    margin-top:2px;
    font:400 12px/1.4 var(--sans);
    color:var(--muted);
  }
  .modes{
    display:flex;
    gap:2px;
    padding:3px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface);
  }
  .mode-btn{
    appearance:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font:500 13px var(--sans);
    padding:7px 16px;
    border-radius:7px;
    cursor:pointer;
    transition:background .12s, color .12s;
  }
  .mode-btn:hover{color:var(--ink)}
  .mode-btn[aria-selected="true"]{background:var(--ink);color:var(--surface)}

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 18px;
    font:400 13px var(--sans);
    color:var(--muted);
    min-height:30px;
  }
  .ctl{display:flex;align-items:center;gap:8px}
  select{
    appearance:none;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--surface);
    color:var(--ink);
    font:500 12px var(--sans);
    padding:6px 26px 6px 10px;
    cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
  }
  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--surface);
  }
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--muted);
    font:500 12px var(--sans);padding:6px 13px;cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--surface-2);color:var(--ink)}
  .switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .switch input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .hint{
    margin-left:auto;
    font:400 12px/1.4 var(--mono);
    color:var(--muted);
    white-space:nowrap;
  }

  /* stats */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .stat{background:var(--surface);padding:12px 16px;min-width:0}
  .stat .v{
    font:600 clamp(19px,2.2vw,26px)/1.1 var(--mono);
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    white-space:nowrap;
  }
  .stat .v .suffix{font:500 12px var(--sans);color:var(--muted);margin-left:2px}
  .stat .k{
    margin-top:4px;
    font:500 10px/1.4 var(--sans);
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* paper */
  .paper{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:clamp(18px,3vw,32px);
    min-height:clamp(190px,28vh,300px);
    max-height:52vh;
    overflow:auto;
    scrollbar-width:thin;
  }
  .paper::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:3px;
    background:var(--accent);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .prompt{
    font-family:var(--mono);
    font-size:clamp(18px,2.1vw,26px);
    line-height:2;
    letter-spacing:.01em;
    color:var(--muted);
    white-space:pre-wrap;
    overflow-wrap:break-word;
    user-select:none;
  }
  .prompt.cjk-mode{
    font-family:var(--sans);
    font-size:clamp(17px,1.9vw,22px);
    line-height:1.95;
    letter-spacing:.02em;
  }
  .prompt .line{white-space:pre-wrap}
  .prompt .ch{
    border-radius:3px;
    transition:color .06s ease, background-color .06s ease;
  }
  .prompt .ch.done{color:var(--ink)}
  .prompt .ch.cur{
    color:var(--accent);
    background:var(--accent-soft);
    box-shadow:inset 0 -2px 0 var(--accent);
    animation:caret 1.1s steps(1,end) infinite;
  }
  .prompt .ch.err{color:var(--bad);background:var(--bad-soft)}
  .prompt .ch.nl{
    color:var(--muted);
    opacity:.55;
    font-size:.82em;
    padding:0 .15em;
  }
  .prompt .ch.nl.done{opacity:.3}
  @keyframes caret{
    0%,55%{box-shadow:inset 0 -2px 0 var(--accent)}
    56%,100%{box-shadow:inset 0 -2px 0 transparent}
  }
  @media (prefers-reduced-motion: reduce){
    .prompt .ch.cur{animation:none}
  }

  .cjk{
    width:100%;
    margin-top:18px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--bg);
    color:var(--ink);
    font:400 17px/1.75 var(--sans);
    resize:none;
    outline:none;
  }
  .cjk::placeholder{color:var(--muted)}
  .cjk:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  /* result */
  .result{display:flex;flex-direction:column;gap:18px}
  .result-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 30px}
  .big{
    display:flex;
    align-items:baseline;
    gap:10px;
    font:600 clamp(40px,7vw,64px)/.95 var(--mono);
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .big .unit{
    font:500 13px var(--sans);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .result-meta{
    color:var(--muted);
    font:400 13.5px/1.6 var(--mono);
  }
  .wrong{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    font:400 13px var(--sans);
    color:var(--muted);
    min-height:28px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface-2);
    font:500 13px var(--mono);
    color:var(--ink);
  }
  .chip b{color:var(--bad);font-weight:600}
  .actions{display:flex;flex-wrap:wrap;gap:10px}
  .btn{
    appearance:none;
    border:1px solid var(--line-strong);
    border-radius:9px;
    background:var(--surface);
    color:var(--ink);
    font:500 14px var(--sans);
    padding:9px 18px;
    cursor:pointer;
    transition:filter .12s, background .12s;
  }
  .btn:hover{filter:brightness(.97)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .best{font:400 13px/1.5 var(--sans);color:var(--muted)}

  /* keyboard */
  .keyboard{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:14px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .kb-row{display:flex;gap:5px;min-width:0}
  .key{
    position:relative;
    flex:1 1 0;
    min-width:0;
    height:clamp(30px,4.6vw,44px);
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line-strong);
    border-bottom:3px solid var(--key-edge);
    border-radius:6px;
    background:var(--key-bg);
    color:var(--key-text);
    font:500 clamp(10px,1.35vw,14px)/1 var(--mono);
    transition:background .08s, color .08s, transform .08s, border-color .08s;
  }
  .key .sub{
    position:absolute;
    top:3px;
    left:5px;
    font:400 .72em/1 var(--mono);
    color:var(--muted);
  }
  .key.shift,.key.wide{
    flex:1.8 1 0;
    font-family:var(--sans);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .key.space{flex:8 1 0;font-family:var(--sans);font-size:10px;letter-spacing:.12em;color:var(--muted)}
  .key.bump::after{
    content:"";
    position:absolute;
    bottom:5px;
    left:50%;
    width:12px;
    height:2px;
    margin-left:-6px;
    border-radius:2px;
    background:var(--line-strong);
  }
  .key.on{
    background:var(--accent);
    border-color:var(--accent);
    border-bottom-color:transparent;
    color:var(--accent-ink);
    transform:translateY(2px);
  }
  .key.on .sub{color:var(--accent-ink);opacity:.85}
  .key.need{
    border-color:var(--accent);
    color:var(--accent);
  }

  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .hint{display:none}
    .brandmark{width:34px;height:34px;font-size:15px}
    .modes{width:100%}
    .mode-btn{flex:1;padding:8px 0}
    .paper{padding:18px 16px;max-height:none;min-height:180px}
    .keyboard{padding:9px;gap:4px;border-radius:10px}
    .kb-row{gap:3px}
    .key{height:30px;border-bottom-width:2px;font-size:10px}
    .key .sub{display:none}
    .key.shift,.key.wide,.key.space{font-size:9px}
    .key.bump::after{display:none}
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brandmark" aria-hidden="true">A</span>
      <div>
        <h1>打字练习台</h1>
        <div class="tagline">指法 · 英文 · 代码 · 中文</div>
      </div>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="练习模式">
      <button class="mode-btn" type="button" role="tab" data-mode="drill" aria-selected="true">指法</button>
      <button class="mode-btn" type="button" role="tab" data-mode="words" aria-selected="false">英文</button>
      <button class="mode-btn" type="button" role="tab" data-mode="code" aria-selected="false">代码</button>
      <button class="mode-btn" type="button" role="tab" data-mode="chinese" aria-selected="false">中文</button>
    </nav>
  </header>

  <div class="controls">
    <label class="ctl" id="drillCtl">
      <span>课程</span>
      <select id="drillCourse">
        <option value="0">基准键 asdf jkl;</option>
        <option value="1">基准键 + g h</option>
        <option value="2">上排 qwerty uiop</option>
        <option value="3">下排 zxcv bnm , . /</option>
        <option value="4">全字母</option>
        <option value="5">数字与 shift 符号</option>
      </select>
    </label>
    <div class="seg" id="wordCtl" hidden>
      <button type="button" data-style="words" class="on">单词</button>
      <button type="button" data-style="sentences">句子</button>
    </div>
    <label class="switch" id="strictCtl" title="按错必须改正才能继续">
      <input type="checkbox" id="strict" checked>
      <span>严格模式</span>
    </label>
    <div class="hint">Esc 重开本组 · Tab 换一组</div>
  </div>

  <section class="stats" aria-label="练习统计">
    <div class="stat"><div class="v" id="stSpeed">0</div><div class="k" id="stSpeedLabel">WPM</div></div>
    <div class="stat"><div class="v"><span id="stAcc">100</span><span class="suffix">%</span></div><div class="k">准确率</div></div>
    <div class="stat"><div class="v" id="stErr">0</div><div class="k">错误</div></div>
    <div class="stat"><div class="v"><span id="stProg">0</span><span class="suffix">%</span></div><div class="k">进度</div></div>
  </section>

  <main class="paper" id="paper">
    <div class="prompt" id="prompt"></div>
    <textarea class="cjk" id="cjk" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="在这里输入中文，错字直接改。按 Esc 重开本组。" hidden></textarea>
    <div class="result" id="result" hidden>
      <div class="result-head">
        <div class="big"><span id="rSpeed">0</span><span class="unit" id="rUnit">WPM</span></div>
        <div class="result-meta" id="rMeta"></div>
      </div>
      <div class="wrong" id="rWrong"></div>
      <div class="actions">
        <button class="btn primary" type="button" id="rAgain">重开本组</button>
        <button class="btn" type="button" id="rNext">换一组</button>
      </div>
      <div class="best" id="rBest"></div>
    </div>
  </main>

  <section class="keyboard" id="keyboard" aria-label="虚拟键盘"></section>
</div>

  const PASSAGES = [
`把手指放在基准键上，左手四指依次停在一排中间靠左的四个键上，右手四指停在靠右的四个键上。每敲完一个字母，手指就回到原来的位置，这样下一次移动的距离总是最短的。刚开始会慢，甚至觉得别扭，但坚持几天之后，你会发现眼睛不必再看键盘，手指自己就记得路。`,

  const DRILLS = [
    { name:'基准键 asdf jkl;', set:'asdfjkl;' },
    { name:'基准键 + g h', set:'asdfgjhkl;' },
    { name:'上排 qwerty uiop', set:'qwertyuiop' },
    { name:'下排 zxcv bnm', set:'zxcvbnm,./' },

  /* ---------- dom ---------- */
  const $ = id => document.getElementById(id);
  const promptEl = $('prompt');
  const paperEl = $('paper');
  const cjkEl = $('cjk');
  const resultEl = $('result');
  const keyboardEl = $('keyboard');
  const drillCtl = $('drillCtl');
  const wordCtl = $('wordCtl');
  const strictCtl = $('strictCtl');
  const strictBox = $('strict');
  const drillCourse = $('drillCourse');
  const elSpeed = $('stSpeed');
  const elSpeedLabel = $('stSpeedLabel');
  const elAcc = $('stAcc');
  const elErr = $('stErr');
  const elProg = $('stProg');

  /* ---------- state ---------- */
  const state = {
    mode:'drill',
    wordStyle:'words',
    drill:0,
    strict:true,
    text:'',
    idx:0,
    correct:0,
    strokes:0,
    errors:0,
    wrong:{},
    start:0,
    finished:false,
    matched:0,
    prevCjkLen:0
  };
  let spanMap = [];
  let curEl = null;

  /* ---------- helpers ---------- */
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(a){
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const pickN = (arr, n) => shuffle(arr.slice()).slice(0, n);
  function pickDifferent(arr){
    if(arr.length < 2) return arr[0];
    for(let i = 0; i < 12; i++){
      const c = pick(arr);
      if(c !== state.text) return c;
    }
    return pick(arr);
  }

  function makeDrill(){
    const set = DRILLS[state.drill] ? DRILLS[state.drill].set : DRILLS[0].set;
    const out = [];
    let len = 0;
    while(len < 54){
      const n = 2 + Math.floor(Math.random() * 4);
      let tok = '';
      for(let i = 0; i < n; i++) tok += set[Math.floor(Math.random() * set.length)];
      out.push(tok);
      len += n + 1;
    }
    return out.join(' ');
  }

  function freshText(){
    if(state.mode === 'drill') return makeDrill();
    if(state.mode === 'words'){
      if(state.wordStyle === 'sentences') return pickN(SENTENCES, 4).join(' ');
      const mix = pickN(W_SHORT, 8).concat(pickN(W_MED, 8), pickN(W_LONG, 8));
      return shuffle(mix).join(' ');
    }
    if(state.mode === 'code') return pickDifferent(CODE);
    return pickDifferent(PASSAGES);
  }

  function bestKey(){
    return state.mode === 'words' ? 'words:' + state.wordStyle : state.mode;
  }

  /* ---------- bests ---------- */
  const BEST_KEY = 'typingPractice.best.v1';
  function loadBests(){
    try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; }
    catch(e){ return {}; }
  }
  function saveBests(obj){
    try { localStorage.setItem(BEST_KEY, JSON.stringify(obj)); }
    catch(e){ /* storage unavailable */ }
  }

  /* ---------- render ---------- */
  function renderPrompt(text){
    promptEl.textContent = '';
    spanMap = new Array(text.length).fill(null);
    const lines = text.split('\n');
    let i = 0;
    for(let li = 0; li < lines.length; li++){
      const lineEl = document.createElement('div');
      lineEl.className = 'line';
      const line = lines[li];
      for(let j = 0; j < line.length; j++){
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = line[j];
        lineEl.appendChild(s);
        spanMap[i] = s;
        i++;
      }
      if(li < lines.length - 1){
        const nl = document.createElement('span');
        nl.className = 'ch nl';
        nl.textContent = '↵';
        lineEl.appendChild(nl);
        spanMap[i] = nl;
        i++;
      }
      promptEl.appendChild(lineEl);
    }
  }

  function scrollCurrent(el){
    if(!el) return;
    const pad = 26;
    const top = el.offsetTop;
    const bottom = top + el.offsetHeight;
    if(top < paperEl.scrollTop + pad) paperEl.scrollTop = Math.max(0, top - pad);
    else if(bottom > paperEl.scrollTop + paperEl.clientHeight - pad){
      paperEl.scrollTop = bottom - paperEl.clientHeight + pad;
    }
  }

  function setCurrent(i){
    if(curEl) curEl.classList.remove('cur');
    curEl = null;
    const s = spanMap[i];
    if(s){
      s.classList.add('cur');
      curEl = s;
      scrollCurrent(s);
    }
    updateKeyHint();
  }

  function renderStats(){
    const cjk = state.mode === 'chinese';
    const elapsed = state.start ? Date.now() - state.start : 0;
    const min = elapsed / 60000;
    let speed = 0;
    if(elapsed >= 500){
      if(cjk){
        const chars = state.finished ? state.text.length : state.matched;
        speed = min > 0 ? Math.round(chars / min) : 0;
      } else {
        speed = min > 0 ? Math.round((state.correct / 5) / min) : 0;
      }
    }
    const acc = state.strokes ? (state.correct / state.strokes) * 100 : 100;
    elSpeed.textContent = speed;
    elSpeedLabel.textContent = cjk ? '字/分' : 'WPM';
    elAcc.textContent = acc >= 99.95 ? '100' : acc.toFixed(1);
    elErr.textContent = state.errors;
    const prog = state.text.length ? Math.round((state.idx / state.text.length) * 100) : 0;
    elProg.textContent = Math.min(100, prog);
  }

  /* ---------- keyboard ---------- */
  const SHIFT_LABELS = {
    '`':'~','1':'!','2':'@','3':'#','4':'$','5':'%','6':'^','7':'&','8':'*','9':'(','0':')',
    '-':'_','=':'+','[':'{',']':'}','\\':'|',';':':',"'":'"',',':'<','.':'>','/':'?'
  };
  const SHIFT_MAP = {};
  Object.keys(SHIFT_LABELS).forEach(base => { SHIFT_MAP[SHIFT_LABELS[base]] = base; });
  const BASE_CHARS = new Set(['`','-','=','[',']','\\',';',"'",',','.','/']);
  const kbEls = {};
  const allKeys = [];
  const shiftKeys = [];

  function makeKey(ch){
    const el = document.createElement('div');
    el.className = 'key';
    if(ch === 'f' || ch === 'j') el.classList.add('bump');
    if(SHIFT_LABELS[ch]){
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = SHIFT_LABELS[ch];
      el.appendChild(sub);
    }
    const main = document.createElement('span');
    main.className = 'main';
    main.textContent = /[a-z]/.test(ch) ? ch.toUpperCase() : ch;
    el.appendChild(main);
    kbEls[ch] = el;
    allKeys.push(el);
    return el;
  }

  function makeShift(){
    const el = document.createElement('div');
    el.className = 'key shift';
    el.textContent = 'Shift';
    shiftKeys.push(el);
    allKeys.push(el);
    return el;
  }

  function buildKeyboard(){
    keyboardEl.textContent = '';
    const rows = [
      ['`','1','2','3','4','5','6','7','8','9','0','-','='],
      ['q','w','e','r','t','y','u','i','o','p','[',']','\\'],
      ['a','s','d','f','g','h','j','k','l',';',"'"]
    ];
    rows.forEach((row, ri) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'kb-row';
      row.forEach(ch => rowEl.appendChild(makeKey(ch)));
      if(ri === 1){
        const enter = document.createElement('div');
        enter.className = 'key wide';
        enter.textContent = 'Enter';
        kbEls['Enter'] = enter;
        allKeys.push(enter);
        rowEl.appendChild(enter);
      }
      keyboardEl.appendChild(rowEl);
    });

    const r4 = document.createElement('div');
    r4.className = 'kb-row';
    r4.appendChild(makeShift());
    ['z','x','c','v','b','n','m',',','.','/'].forEach(ch => r4.appendChild(makeKey(ch)));
    r4.appendChild(makeShift());
    keyboardEl.appendChild(r4);

    const r5 = document.createElement('div');
    r5.className = 'kb-row';
    const space = document.createElement('div');
    space.className = 'key space';
    space.textContent = '空格';
    kbEls[' '] = space;
    allKeys.push(space);
    r5.appendChild(space);
    keyboardEl.appendChild(r5);
  }

  function keyFor(ch){
    if(ch === '\n') return { k:'Enter', shift:false };
    if(ch === ' ') return { k:' ', shift:false };
    const lower = ch.toLowerCase();
    if(/[a-z]/.test(lower)) return { k:lower, shift: ch !== lower };
    if(SHIFT_MAP[ch]) return { k:SHIFT_MAP[ch], shift:true };
    if(/[0-9]/.test(ch) || BASE_CHARS.has(ch)) return { k:ch, shift:false };
    return null;
  }

  function clearHint(){
    for(const el of allKeys) el.classList.remove('on','need');
  }

  function updateKeyHint(){
    clearHint();
    if(state.mode === 'chinese' || state.finished) return;
    const ch = state.text[state.idx];
    if(ch === undefined) return;
    const m = keyFor(ch);
    if(!m) return;
    if(kbEls[m.k]) kbEls[m.k].classList.add('on');
    if(m.shift) shiftKeys.forEach(el => el.classList.add('need'));
  }

  /* ---------- typing engine ---------- */
  function handleChar(ch){
    if(state.finished) return;
    const expected = state.text[state.idx];
    if(expected === undefined) return;
    if(!state.start) state.start = Date.now();
    state.strokes++;

    if(ch === expected){
      state.correct++;
      const s = spanMap[state.idx];
      if(s){ s.classList.remove('cur'); s.classList.add('done'); }
      if(curEl === s) curEl = null;
      state.idx++;
      renderStats();
      if(state.idx >= state.text.length) finishRun();
      else setCurrent(state.idx);
    } else {
      state.errors++;
      state.wrong[ch] = (state.wrong[ch] || 0) + 1;
      const s = spanMap[state.idx];
      if(state.strict){
        if(s){
          s.classList.add('err');
          setTimeout(() => s.classList.remove('err'), 170);
        }
      } else {
        if(s){ s.classList.remove('cur'); s.classList.add('err'); }
        if(curEl === s) curEl = null;
        state.idx++;
        if(state.idx >= state.text.length) finishRun();
        else setCurrent(state.idx);
      }
      renderStats();
    }
  }

  function finishRun(){
    if(state.finished) return;
    state.finished = true;
    clearHint();
    showResult();
  }

  function showResult(){
    const cjk = state.mode === 'chinese';
    const elapsed = state.start ? Date.now() - state.start : 0;
    const min = Math.max(elapsed / 60000, 1e-6);
    const speed = cjk
      ? Math.round(state.matched / min)
      : Math.round((state.correct / 5) / min);
    const acc = state.strokes ? (state.correct / state.strokes) * 100 : 100;
    const unit = cjk ? '字/分' : 'WPM';

    $('rSpeed').textContent = speed;
    $('rUnit').textContent = unit;
    $('rMeta').textContent = '准确率 ' + (acc >= 99.95 ? '100' : acc.toFixed(1)) +
      '% · 错误 ' + state.errors + ' · 用时 ' + (elapsed / 1000).toFixed(1) + ' 秒';

    const wrongEl = $('rWrong');
    wrongEl.textContent = '';
    if(!cjk){
      const top = Object.keys(state.wrong)
        .map(k => [k, state.wrong[k]])
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);
      if(top.length){
        const lab = document.createElement('span');
        lab.textContent = '最常按错：';
        wrongEl.appendChild(lab);
        top.forEach(item => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          const b = document.createElement('b');
          b.textContent = item[0] === ' ' ? '空格' : item[0];
          chip.appendChild(b);
          chip.appendChild(document.createTextNode(' × ' + item[1]));
          wrongEl.appendChild(chip);
        });
      } else {
        const ok = document.createElement('span');
        ok.textContent = '没有按错的键。';
        wrongEl.appendChild(ok);
      }
    }

    const bestEl = $('rBest');
    const key = bestKey();
    const bests = loadBests();
    const prev = bests[key] || 0;
    if(speed > prev){
      bests[key] = speed;
      saveBests(bests);
      bestEl.textContent = prev
        ? '新纪录，之前最好 ' + prev + ' ' + unit + '。'
        : '首个记录：' + speed + ' ' + unit + '。';
    } else {
      bestEl.textContent = '本模式最佳 ' + prev + ' ' + unit + '。';
    }

    promptEl.hidden = true;
    cjkEl.hidden = true;
    resultEl.hidden = false;
  }

  /* ---------- Chinese mode ---------- */
  function updateCJK(){
    if(state.mode !== 'chinese' || state.finished) return;
    const v = cjkEl.value;
    if(v.length && !state.start) state.start = Date.now();

    let n = 0;
    const lim = Math.min(v.length, state.text.length);
    while(n < lim && v[n] === state.text[n]) n++;

    if(v.length > state.prevCjkLen){
      for(let k = state.prevCjkLen; k < v.length; k++){
        state.strokes++;
        if(k < state.text.length && v[k] === state.text[k]) state.correct++;
        else state.errors++;
      }
    }
    state.prevCjkLen = v.length;
    state.matched = n;
    state.idx = Math.min(v.length, state.text.length);

    for(let i = 0; i < spanMap.length; i++){
      const s = spanMap[i];
      if(!s) continue;
      s.classList.remove('done','cur','err');
      if(i < n) s.classList.add('done');
      else if(i === n) s.classList.add(v.length > n ? 'err' : 'cur');
    }
    if(spanMap[n]) scrollCurrent(spanMap[n]);
    renderStats();

    if(v === state.text){
      state.matched = state.text.length;
      state.idx = state.text.length;
      finishRun();
    }
  }

  /* ---------- run control ---------- */
  function syncControls(){
    drillCtl.hidden = state.mode !== 'drill';
    wordCtl.hidden = state.mode !== 'words';
    strictCtl.hidden = state.mode === 'chinese';
  }

  function resetRun(text){
    state.text = text;
    state.idx = 0;
    state.correct = 0;
    state.strokes = 0;
    state.errors = 0;
    state.wrong = {};
    state.start = 0;
    state.finished = false;
    state.matched = 0;
    state.prevCjkLen = 0;

    resultEl.hidden = true;
    promptEl.hidden = false;
    const cjk = state.mode === 'chinese';
    cjkEl.hidden = !cjk;
    keyboardEl.hidden = cjk;
    promptEl.classList.toggle('cjk-mode', cjk);
    if(cjk) cjkEl.value = '';
    paperEl.scrollTop = 0;

    renderPrompt(text);
    renderStats();
    setCurrent(0);

    if(cjk) setTimeout(() => cjkEl.focus(), 0);
  }

  function newSet(){
    resetRun(freshText());
  }

  function restartSame(){
    resetRun(state.text);
  }

  function setMode(mode){
    if(state.mode === mode){
      if(mode === 'chinese' && !state.finished) cjkEl.focus();
      return;
    }
    state.mode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.mode === mode));
    });
    syncControls();
    newSet();
  }

  /* ---------- events ---------- */
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.blur();
      setMode(btn.dataset.mode);
    });
  });

  document.querySelectorAll('#wordCtl button').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.blur();
      state.wordStyle = btn.dataset.style;
      document.querySelectorAll('#wordCtl button').forEach(b => {
        b.classList.toggle('on', b.dataset.style === state.wordStyle);
      });
      if(state.mode === 'words') newSet();
    });
  });

  drillCourse.addEventListener('change', () => {
    state.drill = Number(drillCourse.value) || 0;
    drillCourse.blur();
    if(state.mode === 'drill') newSet();
  });

  strictBox.addEventListener('change', () => {
    state.strict = strictBox.checked;
  });

  $('rAgain').addEventListener('click', e => { e.currentTarget.blur(); restartSame(); });
  $('rNext').addEventListener('click', e => { e.currentTarget.blur(); newSet(); });

  promptEl.addEventListener('click', () => {
    if(state.mode === 'chinese' && !state.finished) cjkEl.focus();
  });

  cjkEl.addEventListener('input', e => {
    if(e.isComposing) return;
    updateCJK();
  });
  cjkEl.addEventListener('compositionend', () => updateCJK());
  cjkEl.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing) e.preventDefault();
  });

  document.addEventListener('keydown', e => {
    if(e.isComposing) return;
    const tag = e.target && e.target.tagName;
    if(tag === 'INPUT' || tag === 'SELECT') return;

    if(e.key === 'Escape'){
      e.preventDefault();
      restartSame();
      return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      newSet();
      return;
    }
    if(state.mode === 'chinese') return;

    if(state.finished){
      if(e.key === 'Enter'){ e.preventDefault(); restartSame(); }
      return;
    }
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === 'Enter'){
      if(state.text[state.idx] === '\n'){
        e.preventDefault();
        handleChar('\n');
      }
      return;
    }
    if(e.key.length !== 1) return;
    e.preventDefault();
    handleChar(e.key);
  });

  /* ---------- boot ---------- */
  buildKeyboard();
  syncControls();
  resetRun(freshText());
  setInterval(() => {
    if(state.start && !state.finished) renderStats();
  }, 250);
})();
</script>
